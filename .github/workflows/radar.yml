name: Rebuild Radar

# Keeps the Fights tab on a ROLLING FOUR WEEKS instead of a fixed list that
# runs dry. Runs every morning, and again just before the Friday email so the
# site the email links to is current when people click through.
on:
  schedule:
    - cron: "0 19 * * *"    # 5am Sydney AEST daily (6am AEDT)
    - cron: "0 23 * * 4"    # 9am Sydney Friday, an hour before the email
  workflow_dispatch: {}
concurrency:
  group: radar-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the fights (rolling four weeks)
        run: python build_radar.py
      - name: Rebuild the Panthers draw
        run: python build_panthers.py
      - name: Rebuild the Raiders draw
        run: python build_raiders.py
      - name: Rebuild the Man Utd fixtures
        run: python build_united.py
      - name: Rebuild the F1 calendar
        run: python build_f1.py
      - name: Rebuild the MotoGP calendar
        run: python build_motogp.py
      - name: Rebuild the PGA TOUR calendar
        run: python build_pga.py
      - name: Rebuild the ATP and WTA tennis calendar
        run: python build_tennis.py
      - name: Rebuild the Wolves fixtures
        run: python build_wolves.py
      - name: Rebuild the standings panels
        run: python build_standings.py
      - name: Point the feedback buttons at the public address
        env:
          # FEEDBACK_TO is what the world sees. It can be a plus-alias of the
          # login account (jack+bawa@gmail.com) or a separate address that
          # forwards there — either way collect_feedback.py still reads it,
          # because it logs into GMAIL_USER's mailbox. Falls back to the login
          # address when FEEDBACK_TO is not set.
          PUBLIC_ADDR: ${{ secrets.FEEDBACK_TO || secrets.GMAIL_USER }}
        run: |
          sed -i "s|mailto:[^?\"]*?subject=%5BBAWA%20FEEDBACK%5D|mailto:${PUBLIC_ADDR}?subject=%5BBAWA%20FEEDBACK%5D|g" index.html
          grep -c "BAWA%20FEEDBACK" index.html

      - name: Commit if the radar changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "fight-radar-bot"
            git config user.email "actions@github.com"
            git add index.html
            git commit -m "Rolling radar rebuild [skip ci]"
            # the other workflow also pushes to main — rebase first so a
            # same-minute build does not lose this commit to a rejected push
            git pull --rebase --autostash origin main
            git push
          else
            echo "no change"
          fi
