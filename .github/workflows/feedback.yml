name: Collect Feedback

# Reads the [BAWA FEEDBACK] emails the buttons on the page send, writes them up
# in feedback/log.md and emails Jack a digest. Silent when nobody wrote in.
on:
  schedule:
    - cron: "0 21 * * 0"    # 7am Sydney Monday
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the inbox and write it up
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAINTENANCE_TO || secrets.GMAIL_USER }}
        run: python collect_feedback.py
      - name: Commit the log
        run: |
          if [ -n "$(git status --porcelain feedback/log.md)" ]; then
            git config user.name "fight-radar-bot"
            git config user.email "actions@github.com"
            git add feedback/log.md
            git commit -m "Feedback round-up [skip ci]"
            git pull --rebase --autostash origin main
            git push
          else
            echo "nothing new"
          fi
