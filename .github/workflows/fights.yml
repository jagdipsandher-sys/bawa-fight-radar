name: BAWA Fight Radar
on:
  schedule:
    # GitHub cron is UTC, and GitHub's own docs warn scheduled runs can be
    # delayed or silently skipped under load — on 28 Aug 2026 two separate
    # fixed-time triggers both failed to fire and nothing went out until a
    # manual run caught it. So instead of hoping one exact minute works,
    # this polls every 10 minutes across the whole 10am–11am Sydney window
    # (00:00 UTC = 10am Sydney AEST; the window drifts to 11am–12pm once
    # AEDT starts, same seasonal caveat as before). send_fights.py's
    # .last_sent marker makes every tick after the first a free no-op, so
    # this only ever actually sends once — it just gives 6 independent
    # chances instead of 2 for one of them to land.
    - cron: "*/10 0 * * 5"
  workflow_dispatch:      # run it by hand from the Actions tab to test
    inputs:
      test_to:
        description: "Test send to ONE address (leave blank to use the normal list)"
        required: false
        default: ""
concurrency:
  group: fight-radar
  cancel-in-progress: false
permissions:
  contents: write         # lets the job commit the .last_sent marker
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fixtures and email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # blank/absent test_to (i.e. every scheduled Friday run) falls through
          # to the normal recipient list — the override is manual-runs-only
          MAIL_TO: ${{ github.event.inputs.test_to || secrets.MAIL_TO }}
          RADAR_TEST: ${{ github.event.inputs.test_to && '1' || '' }}
        run: python send_fights.py
      - name: Commit sent marker
        run: |
          if ! git diff --quiet -- .last_sent 2>/dev/null || [ -n "$(git status --porcelain .last_sent)" ]; then
            git config user.name "fight-radar-bot"
            git config user.email "actions@github.com"
            git add .last_sent
            git commit -m "mark sent [skip ci]"
            # the other workflow also pushes to main — rebase first so a
            # same-minute build does not lose this commit to a rejected push
            git pull --rebase --autostash origin main
            git push
          fi
