name: BAWA Fight Radar
on:
  schedule:
    # Target: in the boys' inboxes between 9:00 and 10:30am Sydney.
    #
    # Two things make that harder than one cron line. GitHub runs free
    # scheduled jobs LATE, by anything from 28 minutes to 3 hours, and it
    # appears to deprioritise frequent schedules: a "*/10" line through Sep
    # 2026 produced exactly ONE run a week, consistently ~2.5h late, where
    # two spaced hourly lines before it had both run within the hour.
    #
    # So: spaced hourly attempts starting well before the window, and
    # send_fights.py decides when it is actually allowed to send. An attempt
    # landing before 9am exits quietly and the next one takes it. Whatever
    # the delay happens to be that week, one attempt lands in the window.
    # Hours are UTC, and cover the window in both AEST (+10) and AEDT (+11).
    - cron: "0 19 * * 4"
    - cron: "0 20 * * 4"
    - cron: "0 21 * * 4"
    - cron: "0 22 * * 4"
    - cron: "0 23 * * 4"
    - cron: "0 0 * * 5"
  workflow_dispatch:      # run it by hand from the Actions tab
    inputs:
      test_to:
        description: "TEST send to these addresses, comma separated. Subject gets a [TEST] prefix"
        required: false
        default: ""
      send_only:
        description: "REAL send of this week's email to just these addresses, comma separated. For someone who has only just joined. Does not affect the weekly send"
        required: false
        default: ""
concurrency:
  group: fight-radar
  cancel-in-progress: false
permissions:
  contents: write         # lets the job commit the .last_sent marker
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fixtures and email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Both overrides are manual-runs-only: on a scheduled Friday run both
          # inputs are absent, so this falls through to the normal list.
          # send_only wins if someone fills in both, and then no [TEST] prefix
          # is added, because a real send to a new joiner is the whole point.
          MAIL_TO: ${{ github.event.inputs.send_only || github.event.inputs.test_to || secrets.MAIL_TO }}
          RADAR_TEST: ${{ (!github.event.inputs.send_only && github.event.inputs.test_to) && '1' || '' }}
          RADAR_SOLO: ${{ github.event.inputs.send_only && '1' || '' }}
          # What people SEE in their inbox. Gmail will only send as the account
          # it logs in with, so the address itself cannot be faked here, but the
          # display name is what almost every mail client actually shows.
          # Override by adding a FROM_NAME secret.
          # Neither of these is actually secret (both are visible in every
          # email), so the real value lives here where it can be read and
          # changed. A repo secret still overrides it if ever needed.
          # The doubled apostrophe is how a GitHub expression escapes one.
          FROM_NAME: ${{ secrets.FROM_NAME || 'BAWA''s Friday Fire Up' }}
          # Set FROM_ADDR only once that address is a VERIFIED "Send mail as"
          # alias on the GMAIL_USER account, otherwise Gmail silently rewrites
          # it back and the change does nothing.
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          # Where a reply and an unsubscribe land. Falls back to the sending
          # account when unset.
          REPLY_TO: ${{ secrets.REPLY_TO || 'jack@topsecretimports.com.au' }}
        run: python send_fights.py
      - name: Commit sent marker
        run: |
          if ! git diff --quiet -- .last_sent 2>/dev/null || [ -n "$(git status --porcelain .last_sent)" ]; then
            git config user.name "fight-radar-bot"
            git config user.email "actions@github.com"
            git add .last_sent
            git commit -m "mark sent [skip ci]"
            # the other workflow also pushes to main — rebase first so a
            # same-minute build does not lose this commit to a rejected push
            git pull --rebase --autostash origin main
            git push
          fi
